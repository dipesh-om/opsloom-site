<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Opsloom">
  <!-- Opsloom mark: threads woven on a loom; one thread turns into a check ("checked before it ships") -->
  <rect width="64" height="64" rx="15" fill="#1E2A5E"/>
  <g stroke-linecap="round" fill="none">
    <!-- warp (vertical threads) -->
    <path d="M20 12v40M32 12v40M44 12v40" stroke="#AEB9E3" stroke-width="4"/>
    <!-- weft (horizontal threads), woven over/under with background halos -->
    <path d="M12 22h40" stroke="#1E2A5E" stroke-width="9"/>
    <path d="M12 22h40" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M20 16v12" stroke="#AEB9E3" stroke-width="4"/>
    <path d="M44 16v12" stroke="#AEB9E3" stroke-width="4"/>
    <!-- the check -->
    <path d="M15 37l10 10 25-26" stroke="#1E2A5E" stroke-width="10" stroke-linejoin="round"/>
    <path d="M15 37l10 10 25-26" stroke="#F4A93B" stroke-width="5.5" stroke-linejoin="round"/>
  </g>
</svg>
